# Isolated test database: never use the development PostgreSQL database or its seeder.
spring.datasource.url=jdbc:h2:mem:spotgo-tests;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE,HOUR,ROWNUM,DAY
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.show-sql=false
app.seeder.enabled=false
logging.level.org.hibernate.SQL=WARN

authorization.jwt.secret=SpotGoTestOnlySigningKeyDoNotUseOutsideTests123456789

app.monitoring.health-check-ms=3600000
