# Se carga sobre application.properties al definir SPRING_PROFILES_ACTIVE=production.
# Sobrescribe los valores locales; no activar dev junto con production.
# Production DataSource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA / Hibernate Configuration for Production
spring.jpa.show-sql=false
# Conserva los datos al arrancar y aplica cambios compatibles del esquema.
# No usar create ni create-drop en produccion.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Server configuration
server.port=${PORT:8080}

# JWT
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.access-expiration-minutes=15
authorization.jwt.refresh-expiration-days=7

# Password reset
app.password-reset.from-email=${APP_PASSWORD_RESET_FROM_EMAIL:}
app.password-reset.resend-api-key=${RESEND_API_KEY:}
app.password-reset.resend-url=${RESEND_API_URL:https://api.resend.com/emails}

# Billing: real commercial plans are supplied by environment; local dev can use seed demo plans.
app.billing.plans-json=${BILLING_PLANS_JSON:[]}
app.billing.retry-delay-seconds=60
app.billing.debt-due-hours=24
app.billing.overstay-charge-basis=AFTER_TOLERANCE

# Monitoring: escala de calidad 0..100; umbral y frescura configurables
app.monitoring.minimum-quality=${MONITORING_MINIMUM_QUALITY:80}
app.monitoring.freshness-seconds=${MONITORING_FRESHNESS_SECONDS:300}
app.monitoring.health-check-ms=60000

# No cargar datos demo en produccion. La carga inicial la configurara el responsable del despliegue.
# DbSeeder tambien esta restringido a perfiles locales; cambiar solo este flag no lo activa.
app.seeder.enabled=false

# Private uploaded evidence images; use a persistent disk in production.
app.monitoring.evidence-directory=${EVIDENCE_STORAGE_DIRECTORY:./storage/evidence}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
