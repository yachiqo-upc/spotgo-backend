# Production DataSource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA / Hibernate Configuration for Production
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Server configuration
server.port=${PORT:8080}

# JWT
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.access-expiration-minutes=15
authorization.jwt.refresh-expiration-days=7

# Password reset
app.password-reset.from-email=${APP_PASSWORD_RESET_FROM_EMAIL:}
app.password-reset.resend-api-key=${RESEND_API_KEY:}
app.password-reset.resend-url=${RESEND_API_URL:https://api.resend.com/emails}

# Billing: real commercial plans are supplied by environment; local dev can use seed demo plans.
app.billing.plans-json=${BILLING_PLANS_JSON:[]}
app.billing.retry-delay-seconds=60
app.billing.debt-due-hours=24
app.billing.overstay-charge-basis=AFTER_TOLERANCE
