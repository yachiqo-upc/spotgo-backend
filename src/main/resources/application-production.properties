# Loaded on top of application.properties when SPRING_PROFILES_ACTIVE=production.
# Overrides local settings; do not activate dev and production together.
# Production DataSource configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Production Spring Data JPA and Hibernate configuration
spring.jpa.show-sql=false
# Preserves data at startup and applies compatible schema changes.
# Do not use create or create-drop in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Server configuration
server.port=${PORT:8080}

# JWT
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.access-expiration-minutes=15
authorization.jwt.refresh-expiration-days=7

# These credentials are required only when the database does not yet contain a SUPER_ADMIN.
app.bootstrap.super-admin.email=${SUPERADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap.super-admin.password=${SUPERADMIN_BOOTSTRAP_PASSWORD:}

# Password reset
app.password-reset.from-email=${APP_PASSWORD_RESET_FROM_EMAIL:}
app.password-reset.resend-api-key=${RESEND_API_KEY:}
app.password-reset.resend-url=${RESEND_API_URL:https://api.resend.com/emails}

# Billing retry delay, outstanding-balance deadline, and overtime calculation policy.
app.billing.retry-delay-seconds=60
app.billing.debt-due-hours=24
app.billing.overstay-charge-basis=AFTER_TOLERANCE

# Monitoring: quality ranges from 0 to 100; minimum quality and reading freshness are configurable.
app.monitoring.minimum-quality=${MONITORING_MINIMUM_QUALITY:80}
app.monitoring.freshness-seconds=${MONITORING_FRESHNESS_SECONDS:300}
app.monitoring.health-check-ms=60000

# Do not load demo data in production. The deployment owner will configure initial data.
# DbSeeder is also restricted to local profiles; changing this flag alone does not enable it.
app.seeder.enabled=false

# Uploaded evidence images; use persistent storage in production.
app.monitoring.evidence-directory=${EVIDENCE_STORAGE_DIRECTORY:./storage/evidence}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
