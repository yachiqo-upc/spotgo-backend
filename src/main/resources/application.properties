# Spring Application Name
spring.application.name=spotgo-backend
spring.profiles.active=dev

# App Port
server.port=8080

# Timezone (shifts are in Lima time)
spring.jackson.time-zone=America/Lima

# Spring DataSource Configuration (AQUI SE CONFIGURA LOCAL)
spring.datasource.url=jdbc:postgresql://localhost:5432/spotgo
spring.datasource.username=postgres
spring.datasource.password=${PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=true

#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Application Information for Documentation

# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# Local demo seeder: inserts compatible rows without deleting existing data
app.seeder.enabled=true

# JWT
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=7

# Password reset
app.password-reset.code-expiration-minutes=15
app.password-reset.max-attempts=5
app.password-reset.from-email=${APP_PASSWORD_RESET_FROM_EMAIL:}
app.password-reset.resend-api-key=${RESEND_API_KEY:}
app.password-reset.resend-url=${RESEND_API_URL:https://api.resend.com/emails}

# i18n Message Bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8
