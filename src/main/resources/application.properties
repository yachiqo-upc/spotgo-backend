# Spring Application Name
spring.application.name=spotgo-backend
# The dev profile is used by default for local development.
# Set SPRING_PROFILES_ACTIVE=production on the server to preserve data.
spring.profiles.active=dev

# Application port
server.port=8080

# Time zone (parking sessions use Lima time)
spring.jackson.time-zone=America/Lima

# Spring DataSource configuration (local settings)
spring.datasource.url=jdbc:postgresql://localhost:5432/spotgo
spring.datasource.username=postgres
spring.datasource.password=${PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA configuration
spring.jpa.show-sql=true

# Spring Data JPA and Hibernate configuration
# LOCAL: drops and recreates mapped tables on EVERY startup, including DevTools restarts.
# Production overrides this with update in application-production.properties.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Application information for API documentation

# Values are populated from Maven project metadata.
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# Loads demo data from db.json after recreating the schema.
# The seeder does not delete data; Hibernate performs the reset through create.
# Production overrides this value to false.
app.seeder.enabled=true

# JWT
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.access-expiration-minutes=15
authorization.jwt.refresh-expiration-days=7

# Password reset
app.password-reset.code-expiration-minutes=15
app.password-reset.max-attempts=5
app.password-reset.from-email=${APP_PASSWORD_RESET_FROM_EMAIL:}
app.password-reset.resend-api-key=${RESEND_API_KEY:}
app.password-reset.resend-url=${RESEND_API_URL:https://api.resend.com/emails}

# Internationalized message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Default Swagger group
springdoc.swagger-ui.urls-primary-name=06-complete-backend

# Billing retry delay, outstanding-balance deadline, and overtime calculation policy.
app.billing.retry-delay-seconds=60
app.billing.debt-due-hours=24
app.billing.overstay-charge-basis=AFTER_TOLERANCE

# Monitoring: quality ranges from 0 to 100; minimum quality and reading freshness are configurable.
app.monitoring.minimum-quality=${MONITORING_MINIMUM_QUALITY:80}
app.monitoring.freshness-seconds=${MONITORING_FRESHNESS_SECONDS:300}
app.monitoring.health-check-ms=60000

# Uploaded evidence images; use persistent storage in production.
app.monitoring.evidence-directory=${EVIDENCE_STORAGE_DIRECTORY:./storage/evidence}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
